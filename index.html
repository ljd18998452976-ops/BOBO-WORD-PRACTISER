<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOBOspeak - 拼写练习</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f7fbff, #eef4ff);
      color: #263238;
      display: flex;
      justify-content: center;
      padding: 24px 14px;
    }

    .app {
      width: min(1050px, 100%);
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 18px 45px rgba(35, 70, 120, 0.14);
      padding: 26px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      width: 120px;
      height: auto;
      border-radius: 16px;
      object-fit: contain;
      background: #fff;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #1e3a5f;
    }

    .sub-title {
      margin: 8px 0 0;
      color: #607d8b;
      font-size: 15px;
    }

    .score-box {
      min-width: 150px;
      padding: 14px 18px;
      background: #f1f7ff;
      border-radius: 18px;
      text-align: center;
      font-weight: 700;
      color: #24527a;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 20px;
    }

    .card {
      background: #fbfdff;
      border: 1px solid #e4edf7;
      border-radius: 24px;
      padding: 22px;
    }

    .word-number {
      color: #607d8b;
      font-size: 14px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .meaning {
      font-size: 24px;
      font-weight: 800;
      color: #263238;
      margin-bottom: 14px;
    }

    .voice-status {
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      margin: 12px 0 16px;
      background: #eef7ff;
      color: #28567a;
      font-weight: 700;
    }

    .voice-status.warning {
      background: #fff5dd;
      color: #7a4d00;
    }

    .voice-status.ok {
      background: #eaf8ef;
      color: #17633a;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s ease;
      background: #e8f2ff;
      color: #1f5d91;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(31, 93, 145, 0.12);
    }

    button.primary {
      background: #2f80ed;
      color: white;
    }

    button.success {
      background: #23a55a;
      color: white;
    }

    button.warning {
      background: #ffb020;
      color: #513400;
    }

    button.ghost {
      background: #f4f7fb;
      color: #455a64;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: #1e3a5f;
      margin: 18px 0 10px;
    }

    .answer-slots {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 66px;
      margin-bottom: 18px;
    }

    .slot {
      width: 54px;
      height: 58px;
      border-radius: 16px;
      border: 2px dashed #b9d0e5;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #2c5d88;
      cursor: pointer;
      user-select: none;
    }

    .slot.filled {
      border-style: solid;
      background: #edf6ff;
    }

    .letter-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 70px;
      padding: 12px;
      border-radius: 18px;
      background: #f6faff;
      border: 1px solid #dce9f6;
    }

    .tile {
      width: 54px;
      height: 58px;
      border-radius: 16px;
      background: #2f80ed;
      color: white;
      font-size: 28px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 8px 14px rgba(47, 128, 237, 0.18);
    }

    .tile:hover {
      transform: translateY(-2px);
    }

    .feedback {
      min-height: 36px;
      margin-top: 16px;
      font-size: 20px;
      font-weight: 800;
    }

    .feedback.correct {
      color: #178044;
    }

    .feedback.wrong {
      color: #d64545;
    }

    .nav-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .nav-row button {
      flex: 1;
      min-width: 120px;
    }

    .side-title {
      font-weight: 800;
      color: #1e3a5f;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 210px;
      border: 2px solid #dbe8f5;
      border-radius: 18px;
      padding: 14px;
      resize: vertical;
      font-family: Consolas, monospace;
      font-size: 14px;
      outline: none;
      line-height: 1.5;
    }

    select {
      width: 100%;
      border: 2px solid #dbe8f5;
      border-radius: 14px;
      padding: 10px;
      background: white;
      font-weight: 700;
      color: #455a64;
      outline: none;
    }

    textarea:focus,
    select:focus {
      border-color: #2f80ed;
      box-shadow: 0 0 0 4px rgba(47, 128, 237, 0.1);
    }

    .settings-row {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .mini-label {
      font-size: 13px;
      color: #607d8b;
      font-weight: 800;
      margin-bottom: -4px;
    }

    .small-note {
      font-size: 13px;
      color: #78909c;
      line-height: 1.55;
      margin-top: 10px;
    }

    .word-list {
      margin-top: 14px;
      max-height: 220px;
      overflow: auto;
      display: grid;
      gap: 8px;
    }

    .word-item {
      padding: 10px 12px;
      border-radius: 14px;
      background: #f6f9fd;
      color: #455a64;
      font-weight: 700;
      cursor: pointer;
    }

    .word-item.active {
      background: #2f80ed;
      color: white;
    }

    @media (max-width: 860px) {
      .main-grid {
        grid-template-columns: 1fr;
      }

      .slot,
      .tile {
        width: 48px;
        height: 52px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="header-left">
        <img src="logo.jpg" alt="BOBOspeak Logo" class="logo" />
        <div>
          <h1>BOBOspeak Spelling Practice</h1>
          <p class="sub-title">更适合低年级：听英式发音，点击打乱字母，拼出正确单词。</p>
        </div>
      </div>

      <div class="score-box">
        得分：<span id="score">0</span> / <span id="total">0</span>
      </div>
    </header>

    <div class="main-grid">
      <section class="card">
        <div class="word-number" id="wordNumber">Word 1</div>
        <div class="meaning" id="meaning">中文意思</div>

        <div class="voice-status" id="voiceStatus">正在检测英式语音……</div>

        <div class="btn-row">
          <button class="primary" onclick="speakFullWord()">🔊 听英式发音</button>
          <button class="ghost" onclick="clearAnswer()">🧹 清空重来</button>
        </div>

        <div class="section-title">请把字母放进单词格子里：</div>
        <div class="answer-slots" id="answerSlots"></div>

        <div class="section-title">打乱的字母：</div>
        <div class="letter-bank" id="letterBank"></div>

        <div class="feedback" id="feedback"></div>

        <div class="nav-row">
          <button class="success" onclick="checkAnswer()">检查答案</button>
          <button class="warning" onclick="revealAnswer()">显示答案</button>
          <button onclick="nextWord()">下一题</button>
        </div>
      </section>

      <aside class="card">
        <div class="side-title">单词库编辑区</div>
        <textarea id="wordEditor" spellcheck="false"></textarea>
        <button class="primary" style="width:100%; margin-top:10px;" onclick="loadWordsFromEditor()">一键生成练习</button>

        <div class="settings-row">
          <div class="mini-label">发音速度</div>
          <select id="voiceRate" onchange="saveSettings()">
            <option value="0.7">慢速</option>
            <option value="0.9" selected>正常</option>
            <option value="1.1">稍快</option>
          </select>

          <div class="mini-label">英式语音选择</div>
          <select id="voiceSelect" onchange="selectVoiceManually()">
            <option value="">正在加载英式语音……</option>
          </select>
        </div>

        <p class="small-note">
          格式：英文单词 | 中文意思<br />
          例如：<br />
          apple | 苹果<br />
          banana | 香蕉<br />
          sandwich | 三明治<br /><br />
          说明：这个版本更适合一年级，不需要键盘打字，只需要点击打乱的字母完成拼写。
        </p>

        <div class="side-title" style="margin-top:18px;">当前题目</div>
        <div class="word-list" id="wordList"></div>
      </aside>
    </div>
  </div>

  <script>
    let words = [
      { word: "apple", meaning: "苹果" },
      { word: "banana", meaning: "香蕉" },
      { word: "sandwich", meaning: "三明治" },
      { word: "chocolate", meaning: "巧克力" },
      { word: "elephant", meaning: "大象" }
    ];

    let currentIndex = 0;
    let score = 0;
    let answeredCorrectly = new Set();
    let britishVoices = [];
    let selectedVoice = null;
    let currentSlots = [];
    let bankTiles = [];

    const wordEditor = document.getElementById("wordEditor");
    const meaning = document.getElementById("meaning");
    const wordNumber = document.getElementById("wordNumber");
    const scoreEl = document.getElementById("score");
    const totalEl = document.getElementById("total");
    const wordList = document.getElementById("wordList");
    const voiceRate = document.getElementById("voiceRate");
    const voiceSelect = document.getElementById("voiceSelect");
    const voiceStatus = document.getElementById("voiceStatus");
    const answerSlotsEl = document.getElementById("answerSlots");
    const letterBankEl = document.getElementById("letterBank");
    const feedback = document.getElementById("feedback");

    function init() {
      wordEditor.value = words.map(item => `${item.word} | ${item.meaning}`).join("\n");
      loadSettings();
      loadVoicesStrictly();
      renderWord();
      setTimeout(loadVoicesStrictly, 500);
      setTimeout(loadVoicesStrictly, 1200);
    }

    function getCurrentWord() {
      return words[currentIndex];
    }

    function isBritishVoice(voice) {
      const lang = (voice.lang || "").toLowerCase();
      const name = (voice.name || "").toLowerCase();

      return (
        lang === "en-gb" ||
        lang.startsWith("en-gb") ||
        name.includes("united kingdom") ||
        name.includes("great britain") ||
        name.includes("british") ||
        name.includes("uk english") ||
        name.includes("english uk") ||
        name.includes("google uk english") ||
        name.includes("microsoft george") ||
        name.includes("microsoft hazel") ||
        name.includes("microsoft susan") ||
        name.includes("daniel")
      );
    }

    function loadVoicesStrictly() {
      const allVoices = window.speechSynthesis.getVoices();
      britishVoices = allVoices.filter(isBritishVoice);

      voiceSelect.innerHTML = "";

      if (britishVoices.length === 0) {
        selectedVoice = null;
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "未检测到英式语音";
        voiceSelect.appendChild(option);

        voiceStatus.textContent = "⚠️ 当前设备没有检测到真正的英式语音，banana 等单词可能听起来像美式发音。";
        voiceStatus.className = "voice-status warning";
        return;
      }

      const savedVoiceName = localStorage.getItem("selectedBritishVoiceName");
      selectedVoice = britishVoices.find(v => v.name === savedVoiceName) || britishVoices[0];

      britishVoices.forEach(voice => {
        const option = document.createElement("option");
        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})`;
        if (selectedVoice && voice.name === selectedVoice.name) {
          option.selected = true;
        }
        voiceSelect.appendChild(option);
      });

      voiceStatus.textContent = `✅ 当前英式语音：${selectedVoice.name} (${selectedVoice.lang})`;
      voiceStatus.className = "voice-status ok";
    }

    window.speechSynthesis.onvoiceschanged = function () {
      loadVoicesStrictly();
    };

    function selectVoiceManually() {
      selectedVoice = britishVoices.find(v => v.name === voiceSelect.value) || null;

      if (selectedVoice) {
        localStorage.setItem("selectedBritishVoiceName", selectedVoice.name);
        voiceStatus.textContent = `✅ 当前英式语音：${selectedVoice.name} (${selectedVoice.lang})`;
        voiceStatus.className = "voice-status ok";
        speakFullWord();
      }
    }

    function speak(text) {
      if (!text) return;

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-GB";
      utterance.rate = Number(voiceRate.value || 0.9);
      utterance.pitch = 1;

      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function speakFullWord() {
      if (!selectedVoice) loadVoicesStrictly();
      speak(getCurrentWord().word);
    }

    function createShuffledTiles(word) {
      const arr = word.split("").map((letter, index) => ({
        id: `${letter}_${index}_${Math.random().toString(36).slice(2, 7)}`,
        letter
      }));

      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      // 尽量避免刚好没打乱
      if (arr.map(x => x.letter).join("") === word && arr.length > 1) {
        [arr[0], arr[1]] = [arr[1], arr[0]];
      }

      return arr;
    }

    function renderWord() {
      const item = getCurrentWord();
      meaning.textContent = item.meaning || "请根据读音拼写单词";
      wordNumber.textContent = `Word ${currentIndex + 1} / ${words.length}`;
      totalEl.textContent = words.length;
      scoreEl.textContent = score;
      feedback.textContent = "";
      feedback.className = "feedback";

      currentSlots = new Array(item.word.length).fill(null);
      bankTiles = createShuffledTiles(item.word);

      renderSlots();
      renderBank();
      renderWordList();

      setTimeout(() => {
        speakFullWord();
      }, 350);
    }

    function renderSlots() {
      answerSlotsEl.innerHTML = "";

      currentSlots.forEach((tile, index) => {
        const slot = document.createElement("div");
        slot.className = "slot" + (tile ? " filled" : "");
        slot.textContent = tile ? tile.letter : "";
        slot.onclick = () => removeFromSlot(index);
        answerSlotsEl.appendChild(slot);
      });
    }

    function renderBank() {
      letterBankEl.innerHTML = "";

      bankTiles.forEach(tile => {
        const div = document.createElement("div");
        div.className = "tile";
        div.textContent = tile.letter;
        div.onclick = () => placeTile(tile.id);
        letterBankEl.appendChild(div);
      });
    }

    function placeTile(tileId) {
      const emptyIndex = currentSlots.findIndex(x => x === null);
      if (emptyIndex === -1) return;

      const tileIndex = bankTiles.findIndex(t => t.id === tileId);
      if (tileIndex === -1) return;

      const tile = bankTiles[tileIndex];
      currentSlots[emptyIndex] = tile;
      bankTiles.splice(tileIndex, 1);

      renderSlots();
      renderBank();
    }

    function removeFromSlot(slotIndex) {
      const tile = currentSlots[slotIndex];
      if (!tile) return;

      bankTiles.push(tile);
      currentSlots[slotIndex] = null;

      renderSlots();
      renderBank();
    }

    function clearAnswer() {
      for (let i = 0; i < currentSlots.length; i++) {
        if (currentSlots[i]) {
          bankTiles.push(currentSlots[i]);
          currentSlots[i] = null;
        }
      }

      // 清空后重新打乱一次，增加游戏感
      for (let i = bankTiles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bankTiles[i], bankTiles[j]] = [bankTiles[j], bankTiles[i]];
      }

      renderSlots();
      renderBank();
      feedback.textContent = "";
      feedback.className = "feedback";
    }

    function getUserAnswer() {
      return currentSlots.map(tile => tile ? tile.letter : "").join("");
    }

    function checkAnswer() {
      const userAnswer = getUserAnswer().toLowerCase();
      const correctAnswer = getCurrentWord().word.toLowerCase();

      if (currentSlots.includes(null)) {
        feedback.textContent = "还没拼完哦，先把字母都放进去。";
        feedback.className = "feedback wrong";
        return;
      }

      if (userAnswer === correctAnswer) {
        feedback.textContent = "✅ 太棒了，拼对了！";
        feedback.className = "feedback correct";

        if (!answeredCorrectly.has(currentIndex)) {
          answeredCorrectly.add(currentIndex);
          score += 1;
          scoreEl.textContent = score;
        }

        speakFullWord();
      } else {
        feedback.textContent = "❌ 还不对哦，再试试看。";
        feedback.className = "feedback wrong";
      }
    }

    function revealAnswer() {
      const word = getCurrentWord().word;
      currentSlots = word.split("").map((letter, index) => ({
        id: `answer_${index}`,
        letter
      }));
      bankTiles = [];

      renderSlots();
      renderBank();

      feedback.textContent = `答案：${word}`;
      feedback.className = "feedback correct";
      speakFullWord();
    }

    function nextWord() {
      currentIndex = (currentIndex + 1) % words.length;
      renderWord();
    }

    function loadWordsFromEditor() {
      const lines = wordEditor.value
        .split("\n")
        .map(line => line.trim())
        .filter(Boolean);

      const newWords = lines.map(line => {
        const parts = line.split("|").map(part => part.trim());
        return {
          word: (parts[0] || "").toLowerCase(),
          meaning: parts[1] || "请听读音并拼写"
        };
      }).filter(item => item.word);

      if (newWords.length === 0) {
        alert("请至少输入一个单词。格式：apple | 苹果");
        return;
      }

      words = newWords;
      currentIndex = 0;
      score = 0;
      answeredCorrectly = new Set();
      renderWord();
    }

    function renderWordList() {
      wordList.innerHTML = "";

      words.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "word-item" + (index === currentIndex ? " active" : "");
        div.textContent = `${index + 1}. ${item.meaning}`;
        div.onclick = () => {
          currentIndex = index;
          renderWord();
        };
        wordList.appendChild(div);
      });
    }

    function saveSettings() {
      localStorage.setItem("spellingVoiceRate", voiceRate.value);
    }

    function loadSettings() {
      const savedRate = localStorage.getItem("spellingVoiceRate");
      if (savedRate) voiceRate.value = savedRate;
    }

    init();
  </script>
</body>
</html>
